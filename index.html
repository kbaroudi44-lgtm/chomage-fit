<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>CHÔMAGE FIT</title>
<meta name="theme-color" content="#0a0a0a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  :root{
    --bg:#0a0a0a;
    --bg2:#131313;
    --card:#171717;
    --card-border:#2a2a2a;
    --lime:#d4ff3d;
    --lime-dim:#8ea82a;
    --red:#ff4d4d;
    --text:#f2f2f0;
    --text-dim:#8a8a86;
    --mono: ui-monospace, "SF Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);}
  body{
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    min-height:100vh;
    background-image:
      radial-gradient(ellipse 800px 400px at 50% -10%, rgba(212,255,61,0.07), transparent);
  }
  h1,h2,h3{margin:0; text-transform:uppercase; letter-spacing:0.04em;}
  header.top{
    position:sticky; top:0; z-index:10;
    background:rgba(10,10,10,0.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--card-border);
    padding:16px 18px 14px calc(18px + env(safe-area-inset-left));
    padding-top:calc(16px + env(safe-area-inset-top));
    display:flex; align-items:center; justify-content:space-between;
  }
  header.top .brand{display:flex; flex-direction:column; line-height:1;}
  header.top .brand b{font-size:20px; font-weight:900; letter-spacing:0.02em;}
  header.top .brand span{font-size:11px; color:var(--lime); font-family:var(--mono); margin-top:4px; letter-spacing:0.08em;}
  header.top button.gear{
    background:none;border:1px solid var(--card-border);border-radius:10px;
    width:38px;height:38px;color:var(--text-dim);font-size:18px;cursor:pointer;
  }
  main{padding:16px 16px 24px; max-width:640px; margin:0 auto;}
  .tab{display:none;}
  .tab.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

  /* SEANCE */
  .day-toggle{display:flex; gap:8px; margin-bottom:16px;}
  .day-toggle button{
    flex:1; padding:12px; border-radius:12px; border:1px solid var(--card-border);
    background:var(--card); color:var(--text-dim); font-family:var(--mono); font-weight:700;
    font-size:14px; letter-spacing:0.06em; cursor:pointer;
  }
  .day-toggle button.active{background:var(--lime); color:#0a0a0a; border-color:var(--lime);}
  .ex-card{
    background:var(--card); border:1px solid var(--card-border); border-radius:16px;
    padding:14px 14px 6px; margin-bottom:12px;
  }
  .ex-card .ex-head{display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;}
  .ex-card .ex-name{font-weight:800; font-size:15.5px; text-transform:uppercase; letter-spacing:0.01em;}
  .ex-card .ex-target{font-family:var(--mono); font-size:11.5px; color:var(--lime); margin-top:4px;}
  .ex-card .ex-note{font-size:12px; color:var(--text-dim); margin-top:4px; font-style:italic;}
  .set-row{display:grid; grid-template-columns:28px 1fr 1fr 1fr; gap:8px; align-items:center; margin-bottom:8px;}
  .set-row .set-idx{font-family:var(--mono); color:var(--text-dim); font-size:13px; text-align:center;}
  .set-row input{
    width:100%; background:var(--bg2); border:1px solid var(--card-border); border-radius:10px;
    color:var(--text); font-family:var(--mono); font-size:15px; text-align:center;
    padding:10px 4px; min-height:44px;
  }
  .set-row input:focus{outline:none; border-color:var(--lime);}
  .col-labels{display:grid; grid-template-columns:28px 1fr 1fr 1fr; gap:8px; margin-bottom:6px;}
  .col-labels span{font-size:10px; color:var(--text-dim); text-align:center; font-family:var(--mono); letter-spacing:0.06em;}
  .add-set{background:none; border:1px dashed var(--card-border); color:var(--text-dim); border-radius:10px;
    width:100%; padding:8px; margin:4px 0 10px; font-family:var(--mono); font-size:12px; cursor:pointer;}
  .cardio-row{font-family:var(--mono); font-size:13px; color:var(--text-dim); padding:8px 0 12px;}
  .btn-primary{
    width:100%; background:var(--lime); color:#0a0a0a; border:none; border-radius:14px;
    padding:16px; font-weight:900; font-size:15px; text-transform:uppercase; letter-spacing:0.05em;
    cursor:pointer; margin-top:8px;
  }
  .btn-primary:active{transform:scale(0.98);}
  .toast{
    position:fixed; bottom:calc(90px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%);
    background:var(--lime); color:#0a0a0a; padding:10px 18px; border-radius:100px; font-weight:800;
    font-size:13px; z-index:50; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(-6px);}

  /* JOURNAL */
  .journal-day{background:var(--card); border:1px solid var(--card-border); border-radius:14px; margin-bottom:10px; overflow:hidden;}
  .journal-day summary{padding:14px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; list-style:none;}
  .journal-day summary::-webkit-details-marker{display:none;}
  .journal-day summary .date{font-weight:800; font-family:var(--mono); font-size:13.5px;}
  .journal-day summary .day-badge{font-size:11px; color:var(--lime); font-family:var(--mono);}
  .journal-day .rows{padding:0 14px 14px;}
  .journal-row{display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--card-border); font-family:var(--mono);}
  .journal-row .jn-ex{color:var(--text); flex:1;}
  .journal-row .jn-val{color:var(--text-dim);}
  .empty-state{color:var(--text-dim); text-align:center; padding:40px 20px; font-size:14px; line-height:1.6;}

  /* PROGRESSION */
  .prog-row{
    background:var(--card); border:1px solid var(--card-border); border-radius:14px;
    padding:14px; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;
  }
  .prog-row .p-name{font-weight:800; font-size:14px; text-transform:uppercase;}
  .prog-row .p-sub{font-size:11px; color:var(--text-dim); font-family:var(--mono); margin-top:3px;}
  .prog-row .p-weight{font-family:var(--mono); font-size:18px; font-weight:800; text-align:right;}
  .p-delta{font-size:11.5px; font-family:var(--mono); text-align:right;}
  .p-delta.up{color:var(--lime);}
  .p-delta.down{color:var(--red);}
  .p-delta.flat{color:var(--text-dim);}

  /* BIBLIOTHEQUE */
  .lib-search{
    width:100%; background:var(--card); border:1px solid var(--card-border); border-radius:12px;
    padding:12px 14px; color:var(--text); font-size:14px; margin-bottom:14px;
  }
  .lib-group{margin-bottom:18px;}
  .lib-group h3{font-size:12px; color:var(--lime-dim); margin-bottom:8px; letter-spacing:0.08em;}
  .lib-item{
    display:flex; justify-content:space-between; align-items:center; padding:10px 4px;
    border-bottom:1px solid var(--card-border); font-size:14px; gap:8px;
  }
  .lib-name{flex:1;}
  .lib-right{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .lib-badge{
    font-family:var(--mono); font-size:10px; font-weight:800; padding:3px 8px; border-radius:6px;
  }
  .lib-badge.o{background:rgba(212,255,61,0.15); color:var(--lime);}
  .lib-badge.n{background:rgba(255,77,77,0.12); color:var(--red);}
  .lib-item.excluded .lib-name{color:var(--text-dim); text-decoration:line-through;}
  .lib-video{
    display:flex; align-items:center; justify-content:center;
    width:30px; height:30px; border-radius:50%;
    background:rgba(212,255,61,0.12); border:1px solid rgba(212,255,61,0.3);
    color:var(--lime); text-decoration:none; flex-shrink:0;
  }
  .lib-video svg{width:13px; height:13px; margin-left:1px;}
  .lib-video:active{background:rgba(212,255,61,0.25);}

  /* NAV */
  nav.bottom{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background:rgba(13,13,13,0.96); backdrop-filter:blur(10px);
    border-top:1px solid var(--card-border);
    display:flex; padding-bottom:env(safe-area-inset-bottom);
  }
  nav.bottom button{
    flex:1; background:none; border:none; color:var(--text-dim); padding:10px 4px 8px;
    display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
  }
  nav.bottom button svg{width:22px; height:22px;}
  nav.bottom button span{font-size:10px; font-family:var(--mono); letter-spacing:0.03em;}
  nav.bottom button.active{color:var(--lime);}

  /* MODAL */
  .modal-backdrop{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:100;
    display:none; align-items:flex-end; justify-content:center;
  }
  .modal-backdrop.show{display:flex;}
  .modal{
    background:var(--bg2); border:1px solid var(--card-border); border-radius:20px 20px 0 0;
    width:100%; max-width:640px; padding:20px 20px calc(24px + env(safe-area-inset-bottom));
  }
  .modal h2{font-size:16px; margin-bottom:16px;}
  .modal button.action{
    width:100%; text-align:left; background:var(--card); border:1px solid var(--card-border);
    color:var(--text); padding:14px; border-radius:12px; margin-bottom:10px; font-size:14px; cursor:pointer;
  }
  .modal button.action.danger{color:var(--red); border-color:rgba(255,77,77,0.3);}
  .modal button.close{
    width:100%; background:none; border:none; color:var(--text-dim); padding:12px; margin-top:4px; font-size:13px;
  }
  .modal p.hint{font-size:12px; color:var(--text-dim); line-height:1.5; margin:-6px 0 14px;}
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>Chômage Fit</b><span id="todayLabel">—</span></div>
  <button class="gear" onclick="openSettings()">⚙</button>
</header>

<main>
  <!-- SEANCE -->
  <section class="tab active" id="tab-seance">
    <div class="day-toggle">
      <button id="btnDayA" onclick="setDay('A')">JOUR A</button>
      <button id="btnDayB" onclick="setDay('B')">JOUR B</button>
    </div>
    <div id="seanceList"></div>
    <button class="btn-primary" onclick="finishSession()">Valider la séance</button>
  </section>

  <!-- JOURNAL -->
  <section class="tab" id="tab-journal">
    <div id="journalList"></div>
  </section>

  <!-- PROGRESSION -->
  <section class="tab" id="tab-progression">
    <div id="progList"></div>
  </section>

  <!-- BIBLIOTHEQUE -->
  <section class="tab" id="tab-bib">
    <input class="lib-search" id="libSearch" placeholder="Rechercher un exercice…" oninput="renderLibrary()">
    <div id="libList"></div>
  </section>
</main>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeSettings()">
  <div class="modal">
    <h2>Réglages</h2>
    <p class="hint">Tes données restent sur cet appareil (localStorage). Pense à exporter régulièrement pour ne rien perdre.</p>
    <button class="action" onclick="exportData()">⬇ Exporter mes données (JSON)</button>
    <button class="action" onclick="document.getElementById('importFile').click()">⬆ Importer un fichier JSON</button>
    <input type="file" id="importFile" accept="application/json" style="display:none" onchange="importData(event)">
    <button class="action danger" onclick="resetData()">🗑 Réinitialiser le journal</button>
    <button class="close" onclick="closeSettings()">Fermer</button>
  </div>
</div>

<nav class="bottom">
  <button class="active" data-tab="seance" onclick="setTab('seance')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12h4M18 12h4M6 8v8M9 6v12M15 6v12M18 8v8"/></svg>
    <span>SÉANCE</span>
  </button>
  <button data-tab="journal" onclick="setTab('journal')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
    <span>JOURNAL</span>
  </button>
  <button data-tab="progression" onclick="setTab('progression')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 17l6-6 4 4 8-8M21 7v6h-6"/></svg>
    <span>PROGRESSION</span>
  </button>
  <button data-tab="bib" onclick="setTab('bib')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13z"/></svg>
    <span>LIBRAIRIE</span>
  </button>
</nav>

<script>
const STORAGE_KEY = 'chomageFitData_v1';

const DEFAULT_PROGRAM = {
  A: [
    {name:"Squat barre dos", sets:3, reps:"8", weight:"", rpe:"6-7", note:"Gêne cheville → presse à cuisses"},
    {name:"Développé couché barre", sets:3, reps:"8", weight:"30", rpe:"6-7", note:"Point de départ connu, ajuster"},
    {name:"Rowing câble assis", sets:3, reps:"10", weight:"", rpe:"6-7", note:""},
    {name:"Développé militaire haltères", sets:3, reps:"10", weight:"", rpe:"6-7", note:""},
    {name:"Soulevé de terre roumain", sets:3, reps:"10", weight:"", rpe:"6", note:"Charge légère, focus technique"},
    {name:"Curl haltère", sets:2, reps:"12", weight:"", rpe:"7", note:""}
  ],
  B: [
    {name:"Presse à cuisses", sets:3, reps:"10", weight:"", rpe:"6-7", note:""},
    {name:"Développé incliné haltères", sets:3, reps:"10", weight:"10", rpe:"6-7", note:"Point de départ connu, ajuster"},
    {name:"Tirage poulie haute (barre)", sets:3, reps:"10", weight:"", rpe:"6-7", note:""},
    {name:"Élévation latérale (câble)", sets:2, reps:"12", weight:"", rpe:"7", note:""},
    {name:"Poussée de hanches (barre)", sets:3, reps:"10", weight:"", rpe:"6-7", note:""},
    {name:"Poussée triceps (câble)", sets:2, reps:"12", weight:"", rpe:"7", note:""}
  ]
};

const LIBRARY = [
  {group:"Bas du corps — Quadriceps", items:[
    ["Squat barre dos","O"],["Squat barre avant","O"],["Squat barre de sécurité","O"],["Hack squat (machine)","O"],
    ["Presse à cuisses","O"],["Split squat bulgare","O"],["Fentes (barre/haltères)","O"],["Step ups","O"],
    ["Squat gobelet","O"],["Extension de jambes (machine)","O"]
  ]},
  {group:"Bas du corps — Chaîne postérieure", items:[
    ["Soulevé de terre classique","O"],["Soulevé de terre sumo","O"],["Soulevé de terre roumain","O"],
    ["Soulevé de terre jambes raides","O"],["Poussée de hanches (barre)","O"],["Poussée de hanches (machine)","O"],
    ["Pont fessier","O"],["Leg curl (couché)","O"],["Leg curl (assis)","O"],["Nordic curl","O"],
    ["Good morning","O"],["Tirage câble (pull through)","O"]
  ]},
  {group:"Haut du corps — Pousser horizontal", items:[
    ["Développé couché barre","O"],["Développé couché haltères","O"],["Développé incliné barre","O"],
    ["Développé incliné haltères","O"],["Développé décliné","O"],["Développé pectoral machine","O"],
    ["Écarté câble","O"],["Écarté haltères","O"],["Pec dec (machine)","O"]
  ]},
  {group:"Haut du corps — Pousser vertical", items:[
    ["Développé militaire barre","O"],["Développé militaire haltères","O"],["Arnold press","O"],
    ["Développé assis machine","O"],["Landmine press","O"],["Élévation latérale (haltères)","O"],
    ["Élévation latérale (câble)","O"],["Oiseau deltoïde postérieur (haltères)","O"],
    ["Oiseau deltoïde postérieur (machine)","O"],["Face pull (câble)","O"]
  ]},
  {group:"Haut du corps — Tirer horizontal", items:[
    ["Rowing barre penché","O"],["Rowing haltère","O"],["Rowing câble (assis)","O"],["Rowing machine","O"],
    ["Rowing support thoracique","O"],["Meadows row","O"],["Pendlay row","O"]
  ]},
  {group:"Haut du corps — Tirer vertical", items:[
    ["Traction (poids de corps)","N"],["Traction lestée","N"],["Chin up","N"],
    ["Tirage poulie haute (barre)","O"],["Tirage poulie haute (neutre)","O"],
    ["Tirage unilatéral poulie haute","O"],["Tirage bras tendus poulie haute","O"]
  ]},
  {group:"Bras", items:[
    ["Curl barre","O"],["Curl haltère","O"],["Curl haltère incliné","O"],["Curl câble","O"],["Curl marteau","O"],
    ["Curl pupitre (machine)","O"],["Développé couché prise serrée","O"],["Poussée triceps (câble)","O"],
    ["Extension triceps au-dessus de la tête (câble)","O"],["Skull crushers","O"],["Dips (triceps)","O"]
  ]},
  {group:"Gainage / Core", items:[
    ["Planche","N"],["Cable crunch","N"],["Leg raise suspendu","N"],["Roue abdominale","N"],
    ["Pallof press","N"],["Landmine rotation","N"]
  ]},
  {group:"Mollets", items:[
    ["Élévation mollets debout","N"],["Élévation mollets assis","N"],["Élévation mollets presse","N"]
  ]}
];

function loadData(){
  let raw = localStorage.getItem(STORAGE_KEY);
  if(!raw){
    const fresh = {program: DEFAULT_PROGRAM, log: [], currentDay:'A'};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
  }
  try{ return JSON.parse(raw); } catch(e){
    const fresh = {program: DEFAULT_PROGRAM, log: [], currentDay:'A'};
    localStorage.setItem(STORAGE_KEY, JSON.stringify(fresh));
    return fresh;
  }
}
function saveData(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

let state = loadData();
let draft = {}; // in-progress set inputs for current session, keyed by exerciseName -> [{poids,reps,rpe}]

const DAYS_FR = ["Dimanche","Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi"];
const MONTHS_FR = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
function fmtDate(d){ return `${DAYS_FR[d.getDay()]} ${d.getDate()} ${MONTHS_FR[d.getMonth()]}`; }
function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }

document.getElementById('todayLabel').textContent = fmtDate(new Date()).toUpperCase();

function setTab(tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('tab-'+tab).classList.add('active');
  document.querySelectorAll('nav.bottom button').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  if(tab==='journal') renderJournal();
  if(tab==='progression') renderProgression();
  if(tab==='bib') renderLibrary();
  window.scrollTo(0,0);
}

function setDay(day){
  state.currentDay = day;
  saveData();
  document.getElementById('btnDayA').classList.toggle('active', day==='A');
  document.getElementById('btnDayB').classList.toggle('active', day==='B');
  draft = {};
  renderSeance();
}

function initDraft(day){
  draft = {};
  state.program[day].forEach(ex=>{
    draft[ex.name] = Array.from({length: ex.sets}, ()=>({poids: ex.weight||'', reps:'', rpe:''}));
  });
}

function renderSeance(){
  const day = state.currentDay || 'A';
  if(Object.keys(draft).length===0) initDraft(day);
  const list = document.getElementById('seanceList');
  list.innerHTML = '';
  state.program[day].forEach(ex=>{
    const card = document.createElement('div');
    card.className = 'ex-card';
    let rowsHtml = '';
    draft[ex.name].forEach((row, i)=>{
      rowsHtml += `
        <div class="set-row">
          <div class="set-idx">${i+1}</div>
          <input inputmode="decimal" placeholder="kg" value="${row.poids}" onchange="updateDraft('${escName(ex.name)}',${i},'poids',this.value)">
          <input inputmode="numeric" placeholder="reps" value="${row.reps}" onchange="updateDraft('${escName(ex.name)}',${i},'reps',this.value)">
          <input inputmode="numeric" placeholder="RPE" value="${row.rpe}" onchange="updateDraft('${escName(ex.name)}',${i},'rpe',this.value)">
        </div>`;
    });
    card.innerHTML = `
      <div class="ex-head">
        <div>
          <div class="ex-name">${ex.name}</div>
          <div class="ex-target">${ex.sets} x ${ex.reps} · RPE ${ex.rpe}</div>
          ${ex.note ? `<div class="ex-note">${ex.note}</div>` : ''}
        </div>
      </div>
      <div class="col-labels"><span></span><span>POIDS</span><span>REPS</span><span>RPE</span></div>
      ${rowsHtml}
      <button class="add-set" onclick="addSet('${escName(ex.name)}')">+ Ajouter une série</button>
    `;
    list.appendChild(card);
  });
  const cardio = document.createElement('div');
  cardio.className = 'ex-card';
  cardio.innerHTML = `<div class="ex-head"><div><div class="ex-name">Rameur</div><div class="ex-target">10-12 min · confortable</div></div></div><div class="cardio-row">Cardio ménageant la cheville — pas de saisie nécessaire.</div>`;
  list.appendChild(cardio);
}

function escName(n){ return n.replace(/'/g,"\\'"); }
function updateDraft(name, i, field, val){ draft[name][i][field] = val; }
function addSet(name){
  draft[name].push({poids:'', reps:'', rpe:''});
  renderSeance();
}

function finishSession(){
  const day = state.currentDay || 'A';
  const date = todayISO();
  let count = 0;
  state.program[day].forEach(ex=>{
    draft[ex.name].forEach((row, i)=>{
      if(row.poids !== '' || row.reps !== ''){
        state.log.push({date, day, exercise: ex.name, set: i+1, poids: row.poids, reps: row.reps, rpe: row.rpe});
        count++;
      }
    });
  });
  if(count===0){ showToast('Renseigne au moins une série avant de valider'); return; }
  saveData();
  draft = {};
  showToast(`Séance ${day} enregistrée — ${count} séries`);
  renderSeance();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function renderJournal(){
  const el = document.getElementById('journalList');
  if(state.log.length===0){
    el.innerHTML = `<div class="empty-state">Aucune séance enregistrée pour l'instant.<br>Remplis l'onglet Séance puis valide pour commencer ton journal.</div>`;
    return;
  }
  const byDate = {};
  state.log.forEach(e=>{ (byDate[e.date] = byDate[e.date] || []).push(e); });
  const dates = Object.keys(byDate).sort().reverse();
  el.innerHTML = dates.map((date, idx)=>{
    const entries = byDate[date];
    const day = entries[0].day;
    const rows = entries.map(e=>`
      <div class="journal-row"><span class="jn-ex">${e.exercise} · S${e.set}</span><span class="jn-val">${e.poids||'—'}kg × ${e.reps||'—'} · RPE ${e.rpe||'—'}</span></div>
    `).join('');
    return `<details class="journal-day" ${idx===0?'open':''}>
      <summary><span class="date">${fmtDate(new Date(date+'T12:00:00'))}</span><span class="day-badge">JOUR ${day}</span></summary>
      <div class="rows">${rows}</div>
    </details>`;
  }).join('');
}

function renderProgression(){
  const el = document.getElementById('progList');
  if(state.log.length===0){
    el.innerHTML = `<div class="empty-state">Pas encore de données de progression.<br>Elles apparaîtront après ta première séance validée.</div>`;
    return;
  }
  const byExercise = {};
  state.log.forEach(e=>{
    if(!e.poids) return;
    (byExercise[e.exercise] = byExercise[e.exercise] || []).push(e);
  });
  const names = Object.keys(byExercise).sort();
  el.innerHTML = names.map(name=>{
    const entries = byExercise[name];
    const byDate = {};
    entries.forEach(e=>{ const w=parseFloat(e.poids)||0; byDate[e.date] = Math.max(byDate[e.date]||0, w); });
    const dates = Object.keys(byDate).sort();
    const last = dates[dates.length-1];
    const prev = dates[dates.length-2];
    const lastW = byDate[last];
    let deltaHtml = '<span class="p-delta flat">1ère séance</span>';
    if(prev !== undefined){
      const d = lastW - byDate[prev];
      const cls = d>0?'up':(d<0?'down':'flat');
      const sign = d>0?'+':'';
      deltaHtml = `<span class="p-delta ${cls}">${sign}${d.toFixed(1)}kg vs séance préc.</span>`;
    }
    return `<div class="prog-row">
      <div><div class="p-name">${name}</div><div class="p-sub">${dates.length} séance(s) loggée(s)</div></div>
      <div><div class="p-weight">${lastW}kg</div>${deltaHtml}</div>
    </div>`;
  }).join('');
}

function ytSearchUrl(name){
  return `https://www.youtube.com/results?search_query=${encodeURIComponent(name + ' technique musculation')}`;
}

function renderLibrary(){
  const el = document.getElementById('libList');
  const q = (document.getElementById('libSearch').value || '').toLowerCase();
  el.innerHTML = LIBRARY.map(group=>{
    const items = group.items.filter(([name])=> name.toLowerCase().includes(q));
    if(items.length===0) return '';
    return `<div class="lib-group"><h3>${group.group}</h3>${items.map(([name,status])=>`
      <div class="lib-item ${status==='N'?'excluded':''}">
        <span class="lib-name">${name}</span>
        <div class="lib-right">
          <span class="lib-badge ${status.toLowerCase()}">${status==='O'?'OK':'EXCLU'}</span>
          <a class="lib-video" href="${ytSearchUrl(name)}" target="_blank" rel="noopener" aria-label="Voir la technique sur YouTube">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
          </a>
        </div>
      </div>`).join('')}</div>`;
  }).join('') || `<div class="empty-state">Aucun résultat.</div>`;
}

function openSettings(){ document.getElementById('modalBackdrop').classList.add('show'); }
function closeSettings(){ document.getElementById('modalBackdrop').classList.remove('show'); }

function exportData(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `chomage-fit-backup-${todayISO()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData(event){
  const file = event.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const imported = JSON.parse(e.target.result);
      if(!imported.program || !imported.log) throw new Error('format invalide');
      state = imported;
      saveData();
      draft = {};
      showToast('Données importées');
      closeSettings();
      renderSeance();
    }catch(err){ alert('Fichier invalide : ' + err.message); }
  };
  reader.readAsText(file);
}
function resetData(){
  if(!confirm('Effacer tout le journal de séances ? Cette action est irréversible (exporte une sauvegarde avant si besoin).')) return;
  state = {program: DEFAULT_PROGRAM, log: [], currentDay:'A'};
  saveData();
  draft = {};
  closeSettings();
  renderSeance();
  showToast('Journal réinitialisé');
}

// init
setDay(state.currentDay || 'A');

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
